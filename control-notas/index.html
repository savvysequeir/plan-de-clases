<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Notas · UNIJJAR</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#193448;background:#edf4f4}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#103653,#1b7c86);color:white;padding:20px 3vw}header h1{margin:0}header p{margin:6px 0}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}nav a{color:white;text-decoration:none;border:1px solid #fff8;padding:8px 12px;border-radius:9px}main{padding:20px;max-width:1650px;margin:auto}.panel{background:white;border:1px solid #d5e4e6;border-radius:17px;padding:20px;margin:0 0 17px;box-shadow:0 6px 18px #1233}.panel h2{font-size:1.13rem;color:#124d5d;margin:0 0 15px}.fields{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px}label{display:block;font-size:.85rem;font-weight:700;color:#2d4b59}input,select{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid #c4d6db;border-radius:8px;background:white;color:#173849}button,.button{border:0;border-radius:9px;background:#126a80;color:white;font-weight:700;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{filter:brightness(1.08)}button.alt{background:#e4f1f1;color:#164d5a}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.muted{color:#657985;font-size:.88rem}.message{min-height:25px;color:#11674b;font-weight:600}.scroll{overflow:auto;max-height:70vh;border:1px solid #abc6c4;border-radius:9px}.grades{border-collapse:separate;border-spacing:0;min-width:2200px;width:100%;text-align:center;font-size:13px}.grades th,.grades td{border-right:1px solid #a9c1bc;border-bottom:1px solid #a9c1bc;padding:6px;white-space:nowrap}.grades thead th{background:#dce9f3;color:#173b47;position:sticky;top:0;z-index:3}.grades thead tr:first-child th{background:#b9d9b1}.grades thead tr:nth-child(2) th{top:33px}.grades thead tr:nth-child(3) th{top:94px}.grades .fixed{position:sticky;left:0;z-index:4;background:#f3f8f9}.grades th.fixed{z-index:6}.grades .name{min-width:210px;text-align:left}.grades input[type=number]{width:68px;padding:6px;text-align:center;margin:0 auto}.grades input[type=date]{width:150px;font-size:12px;padding:6px}.grades .total{background:#e7f5e4;font-weight:800}.grades tbody tr:hover td{background:#f2faf8}.grades tbody tr.highlight td{background:#fff3c4}.grades td.name{white-space:normal}.grades .datehead{font-size:12px}.pill{border-radius:7px;background:#edf6f5;padding:8px 12px}.login{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.login label{min-width:190px}.login input{min-width:180px}.stats{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0}.stats span{background:#eaf5f3;padding:9px 12px;border-radius:10px}@media(max-width:900px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}@media print{header,nav,.toolbar,.noprint,.message,#cloudPanel,#lookupPanel{display:none!important}main{padding:0}.panel{box-shadow:none;border:0;padding:0}.scroll{overflow:visible;max-height:none}.grades{font-size:8px;min-width:0}.grades input{border:0!important;font-size:8px!important;width:45px!important}.grades input[type=date]{width:90px!important}body{background:white}@page{size:landscape;margin:8mm}}
/* Legibilidad de la planilla y columnas de identificación visibles */
.scroll{max-height:72vh;border:1px solid #b7d0d4;border-radius:14px;box-shadow:inset 0 0 0 1px #e5eff0;scrollbar-color:#7aadb3 #edf5f5;scrollbar-width:thin}
.grades{min-width:3020px;font-size:14px;border-spacing:0;table-layout:fixed}
.grades th,.grades td{padding:10px 8px;border-color:#d3e2e4;vertical-align:middle}
.grades thead tr:first-child{height:48px}.grades thead tr:nth-child(2){height:66px}.grades thead tr:nth-child(3){height:65px}
.grades thead tr:first-child th{background:#b6d9b1;color:#173e3d;font-size:16px;top:0}
.grades thead tr:nth-child(2) th{background:#d9e9f1;top:48px;font-size:13px}
.grades thead tr:nth-child(3) th{background:#eaf3f7;top:114px}
.grades thead th{box-shadow:0 1px 0 #abc5c8}
.grades tbody tr:nth-child(odd) td{background:#f8fcfd}.grades tbody tr:nth-child(even) td{background:#fff}
.grades tbody tr:hover td{background:#e7f5f7!important}
.grades tbody td.total{background:#e1f4e4!important;color:#145738;font-weight:800;font-variant-numeric:tabular-nums}
.grades th:nth-child(1),.grades td:nth-child(1){min-width:48px;width:48px}
.grades th:nth-child(2),.grades td:nth-child(2){min-width:110px;width:110px}
.grades th:nth-child(3),.grades td:nth-child(3){min-width:100px;width:100px}
.grades th.name,.grades td.name{min-width:290px;width:290px}
.grades tbody td:nth-child(-n+4),.grades thead tr:first-child th:nth-child(-n+4){position:sticky;z-index:5;box-shadow:1px 0 0 #a7c5c8}
.grades tbody td:nth-child(1),.grades thead tr:first-child th:nth-child(1){left:0}
.grades tbody td:nth-child(2),.grades thead tr:first-child th:nth-child(2){left:48px}
.grades tbody td:nth-child(3),.grades thead tr:first-child th:nth-child(3){left:158px}
.grades tbody td:nth-child(4),.grades thead tr:first-child th:nth-child(4){left:258px}
.grades thead tr:first-child th:nth-child(-n+4){z-index:9}
.grades input[type=number]{width:76px;min-height:38px;font-size:14px;border:1px solid #b7d0d7;background:#fff;font-variant-numeric:tabular-nums}
.grades input[type=date]{width:145px;min-height:39px;background:#fff;border:1px solid #b8d0d7;font-size:12px}
.grades .datehead div{font-weight:500;color:#386d79;margin-top:5px}
.grades .name{font-weight:600;color:#23475b}
@media print{.grades{min-width:0;table-layout:auto;font-size:7px}.grades thead th,.grades tbody td{position:static!important}.grades input[type=number]{width:38px;min-height:0}.grades input[type=date]{width:80px;min-height:0}}
</style></head><body>
<header><h1>📊 Control de Notas · UNIJJAR</h1><nav><a href="../index.html">Inicio</a><a href="../asistencia/index.html">Asistencia</a><a href="../portal-estudiante/index.html">Portal del estudiante</a><a href="../plan-clases/index.html">Plan de Clases</a></nav></header>
<main><section class="panel"><h2>I. Datos generales</h2><div id="general" class="fields"></div></section>
<section class="panel noprint"><h2>II. Gestión de estudiantes y notas</h2><div class="toolbar"><button id="save">💾 Guardar notas</button><button id="add">＋ Añadir estudiante</button><button id="importAttendance">⇩ Sincronizar estudiantes desde Asistencia</button><button id="importAttendanceFile" class="alt">📂 Cargar respaldo de Asistencia</button><input type="file" id="attendanceFile" accept=".json,application/json" hidden><a class="button" href="../instrumentos/index.html">🧰 Instrumentos</a><a class="button" href="../portal-estudiante/index.html" target="_blank">🎓 Portal de estudiantes</a><button id="publish">☁ Publicar notas</button><button id="pdf">🖨 Imprimir / PDF</button><button class="alt" id="export">Exportar respaldo JSON</button><button class="alt" id="importJson">Importar respaldo JSON</button><input type="file" id="jsonFile" accept="application/json,.json" hidden></div><p class="message" id="message" role="status"></p></section>
<section class="panel noprint" id="lookupPanel"><h2>III. Buscar estudiante por carnet</h2><div class="toolbar"><input id="search" placeholder="Carnet del estudiante" style="max-width:300px"><button id="find">Buscar</button><button class="alt" id="clear">Mostrar todos</button></div><div id="result" class="stats"></div></section>
<section class="panel"><h2>IV. Registro de notas por parciales</h2><div class="toolbar noprint" style="margin-bottom:12px"><button id="importInstrumentScores" class="alt">⇩ Importar notas de Instrumentos por fecha</button><button id="refreshInstruments" class="alt">↻ Actualizar puntajes de Instrumentos</button><span id="instrumentStatus" class="muted"></span></div><div class="scroll"><table class="grades" id="grades"></table></div><p id="counts" class="muted"></p></section>
<section class="panel noprint" id="cloudPanel"><h2>V. Publicación segura en Firebase</h2><div class="login"><label>Correo docente<input type="email" id="email" autocomplete="username"></label><label>Contraseña<input type="password" id="password" autocomplete="current-password"></label><button id="login">Iniciar sesión</button><button id="logout" class="alt">Cerrar sesión</button></div><p id="cloudStatus" class="message">Sin conectar</p></section></main><script src="app.js"></script><script type="module" src="firebase.js"></script></body></html>
