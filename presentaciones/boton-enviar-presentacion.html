<!doctype html><html lang="es"><meta charset="utf-8"><title>Enviar presentación a UNIJJAR</title><style>body{font-family:system-ui;max-width:650px;margin:5rem auto;padding:1rem}input,button{padding:12px;width:100%;box-sizing:border-box;margin:8px 0}button{background:#146c65;color:white;border:0;border-radius:9px;cursor:pointer}</style><h1>Enviar presentación a UNIJJAR</h1><p>Introduce la URL publicada de la presentación y su título. La biblioteca te permitirá elegir la carpeta después de iniciar sesión.</p><label>Título<input id="titulo" placeholder="Session 1 · Greetings"></label><label>Enlace web<input id="url" type="url" placeholder="https://..."></label><button onclick="send()">📤 Enviar a biblioteca</button><script>function send(){let u;try{u=new URL(document.getElementById('url').value);if(!['https:','http:'].includes(u.protocol))throw 0}catch{return alert('Escribe una URL https:// válida')}const library=new URL('index.html',location.href).href;const link=new URL(library);link.searchParams.set('url',u.href);link.searchParams.set('titulo',document.getElementById('titulo').value||'Presentación web');window.open(link.href,'_blank','noopener')}</script></html>
