<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actividades de Pronunciación · UNIJJAR</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#262044;background:#f4f1fc}header{background:linear-gradient(120deg,#29136b,#7042df);color:white;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px max(24px,calc((100% - 1160px)/2))}header img{width:240px;height:145px;object-fit:cover;border-radius:15px}h1{font-size:clamp(26px,4vw,42px);margin:10px 0}a{color:inherit}main{max-width:1160px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card,section{background:white;border:1px solid #ddd2f6;border-radius:18px;padding:22px;box-shadow:0 5px 18px #29136b0d}.card h2{margin:8px 0;font-size:21px}.symbol{font-size:32px;color:#6034cb;font-weight:bold}button,select{font:inherit;border-radius:10px;padding:11px 16px;border:1px solid #d9c9f5}button{background:#6034cb;color:white;cursor:pointer;font-weight:600}button:hover{background:#432399}button:focus-visible,a:focus-visible{outline:3px solid #f5b800;outline-offset:3px}section{margin-top:20px}#word{font-size:36px;font-weight:bold}#ipa{font-size:24px;color:#6034cb}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.muted{color:#655e78}footer{text-align:center;padding:24px;color:#655e78}@media(max-width:600px){header img{width:110px;height:100px}header{padding:20px;gap:12px}main{padding:14px}}

</style></head><body><header><div><a href="index.html">← Volver a Habilidades</a><p>UNIJJAR · Inglés</p><h1>Actividades de Pronunciación</h1><div>Escucha, distingue y reproduce los sonidos del inglés.</div></div><img src="universidad.png" alt="Universidad Jean Jacques Rousseau"></header><main id="actividades"><h2>Selecciona una categoría</h2><div class="grid" id="categories"></div><section id="exercise" hidden><h2 id="topic"></h2><p id="progress"></p><div id="word"></div><div id="ipa"></div><div class="actions"><button id="listen">▶ Escuchar</button><button id="prev">Anterior</button><button id="next">Siguiente</button></div><h3><span id="question">Identifica la transcripción de la palabra</span></h3><div class="actions" id="options"></div><p id="feedback" role="status"></p><p id="score"></p><button id="reset">Reiniciar actividad</button></section></main><footer>Universidad Jean Jacques Rousseau · Habilidades del Inglés</footer><script>
const data=[['Vocales','/iː/ /ɪ/ /æ/',[['sheep','ʃiːp'],['ship','ʃɪp'],['cat','kæt'],['cup','kʌp'],['bed','bed'],['food','fuːd'],['book','bʊk'],['bird','bɜːd'],['car','kɑː'],['hot','hɒt'],['law','lɔː'],['about','əˈbaʊt']]],["Diphthongs", "/eɪ/ /aɪ/ /ɔɪ/", [["day", "deɪ"], ["my", "maɪ"], ["boy", "bɔɪ"], ["now", "naʊ"], ["go", "ɡəʊ"], ["near", "nɪə"], ["hair", "heə"], ["tour", "tʊə"], ["home (US)", "hoʊm"], ["music", "ˈmjuːzɪk"]]], ["Triphthongs", "/eɪə/ /aɪə/ /ɔɪə/", [["player", "ˈpleɪə"], ["fire", "faɪə"], ["loyal", "ˈlɔɪəl"], ["hour", "aʊə"], ["lower", "ˈləʊə"]]], ["Voiced Consonants", "/b/ /d/ /ɡ/", [["bat", "bæt"], ["dog", "dɒɡ"], ["go", "ɡəʊ"], ["van", "væn"], ["zoo", "zuː"], ["this", "ðɪs"], ["vision", "ˈvɪʒən"], ["judge", "dʒʌdʒ"], ["man", "mæn"], ["no", "nəʊ"], ["sing", "sɪŋ"], ["leg", "leɡ"], ["red", "red"], ["yes", "jes"], ["wet", "wet"]]], ["Voiceless Consonants", "/p/ /t/ /k/", [["pen", "pen"], ["ten", "ten"], ["key", "kiː"], ["fan", "fæn"], ["thin", "θɪn"], ["sun", "sʌn"], ["ship", "ʃɪp"], ["chair", "tʃeə"], ["hat", "hæt"]]], ["Consonant Blends", "/str/ /pl/ /sk/", [["street", "striːt"], ["play", "pleɪ"], ["school", "skuːl"], ["spring", "sprɪŋ"], ["black", "blæk"], ["green", "ɡriːn"], ["train", "treɪn"], ["swim", "swɪm"], ["desk", "desk"], ["next", "nekst"]]], ["Digraphs", "sh · ch · th", [["ship", "ʃɪp"], ["chair", "tʃeə"], ["thin", "θɪn"], ["this", "ðɪs"], ["phone", "fəʊn"], ["sing", "sɪŋ"], ["back", "bæk"], ["queen", "kwiːn"], ["write", "raɪt"], ["know", "nəʊ"]]], ["Trigraphs", "tch · dge · igh", [["catch", "kætʃ"], ["bridge", "brɪdʒ"], ["night", "naɪt"], ["light", "laɪt"], ["match", "mætʃ"], ["edge", "edʒ"]]], ["Word Stress", "ˈ", [["teacher", "ˈtiːtʃə"], ["begin", "bɪˈɡɪn"], ["banana", "bəˈnɑːnə"], ["computer", "kəmˈpjuːtə"], ["photograph", "ˈfəʊtəɡrɑːf"], ["photography", "fəˈtɒɡrəfi"]]], ["Sentence Stress", "● ○ ●", [["I bought a new book.", "BOUGHT, NEW, BOOK"], ["She lives in London.", "LIVES, LONDON"], ["We need more time.", "NEED, MORE, TIME"]]], ["Rhythm", "● ○ ○ ●", [["Cats chase mice.", "CATS CHASE MICE"], ["The cats are chasing the mice.", "CATS CHASING MICE"], ["I can go.", "GO"]]], ["Intonation", "↗ ↘", [["Are you ready?", "Ascendente"], ["Where are you going?", "Descendente"], ["I am ready.", "Descendente"]]], ["Pitch", "↗ ↘", [["Really? (surprise)", "Ascenso tonal"], ["That is final.", "Descenso tonal"], ["Hello! (excited)", "Tono relativamente alto"]]], ["Prominence", "●", [["I wanted TEA, not coffee.", "TEA"], ["SHE called, not John.", "SHE"], ["I said MONDAY, not Tuesday.", "MONDAY"]]], ["Affixes", "re- · -ness", [["unhappy", "ʌnˈhæpi"], ["rewrite", "ˌriːˈraɪt"], ["kindness", "ˈkaɪndnəs"], ["careless", "ˈkeələs"]]], ["Prefixes", "un- · re- · dis-", [["unfair", "ʌnˈfeə"], ["rebuild", "ˌriːˈbɪld"], ["dislike", "dɪsˈlaɪk"], ["impossible", "ɪmˈpɒsəbəl"]]], ["Suffixes", "-ed · -s · -tion", [["walked", "wɔːkt"], ["played", "pleɪd"], ["wanted", "ˈwɒntɪd"], ["cats", "kæts"], ["dogs", "dɒɡz"], ["wishes", "ˈwɪʃɪz"], ["nation", "ˈneɪʃən"]]]];const $=id=>document.getElementById(id);let group=0,pos=0,answers={};const palette=["#6941c6","#2563eb","#087e8b","#16834d","#c24138","#a15b13","#7952b3","#087caa","#b43a83","#5254bd","#0e8071","#b45309","#a43b57","#536c25","#7650a1","#1766a1","#a14d23"];data.forEach((d,i)=>{let c=document.createElement('article');c.className='card';c.style.setProperty('--accent',palette[i]);c.innerHTML=`<div class="symbol">${d[1]}</div><h2>${d[0]}</h2>`;let b=document.createElement('button');b.textContent='Iniciar actividad';b.onclick=()=>{group=i;pos=0;render();$('exercise').scrollIntoView({behavior:'smooth'})};c.append(b);if([0,5,8,14].includes(i)){let h=document.createElement('h3');h.className='group-title';h.textContent=({0:'I. Segmental Features',5:'II. Consonant and Spelling Patterns',8:'III. Suprasegmental Features',14:'IV. Affix Pronunciation'})[i];$('categories').append(h)}$('categories').append(c)});function render(){let d=data[group],w=d[2][pos],key=group+':'+pos;let pros=group>=9&&group<=13; $('question').textContent=pros?'Identifica el patrón prosódico propuesto':'Identifica la transcripción de la palabra';$('exercise').hidden=false;$('topic').textContent=d[0];$('progress').textContent=`Ejemplo ${pos+1} de ${d[2].length}`;$('word').textContent=w[0];$('ipa').textContent=answers[key]===undefined?'Selecciona la respuesta':(pros?w[1]:'/'+w[1]+'/');$('options').replaceChildren();let opts=[...new Set([w[1],...d[2].filter(x=>x[1]!==w[1]).map(x=>x[1])])].slice(0,3).sort();opts.forEach(o=>{let b=document.createElement('button');b.textContent=pros?o:'/'+o+'/';b.disabled=answers[key]!==undefined;b.onclick=()=>{answers[key]=o===w[1];render()};$('options').append(b)});$('feedback').textContent=answers[key]===undefined?'':answers[key]?'¡Correcto!':'Revisa la respuesta correcta y escucha nuevamente.';$('score').textContent='Aciertos: '+Object.entries(answers).filter(([k,v])=>k.startsWith(group+':')&&v).length+' / '+d[2].length;$('prev').disabled=pos===0;$('next').disabled=pos===d[2].length-1} $('prev').onclick=()=>{pos--;render()};$('next').onclick=()=>{pos++;render()};$('reset').onclick=()=>{Object.keys(answers).filter(k=>k.startsWith(group+':')).forEach(k=>delete answers[k]);pos=0;render()};$('listen').onclick=()=>{if(!('speechSynthesis'in window)){ $('feedback').textContent='Audio no disponible en este navegador.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[group][2][pos][0]);u.lang=data[group][2][pos][0].includes('(US)')?'en-US':'en-GB';u.text=u.text.replace(/ \(.*?\)/g,'');u.rate=.85;let v=speechSynthesis.getVoices().find(v=>v.lang===u.lang);if(v)u.voice=v;u.onerror=()=>{$('feedback').textContent='No se pudo reproducir el audio.'};speechSynthesis.speak(u)};</script></body></html>
