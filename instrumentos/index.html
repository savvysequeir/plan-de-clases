<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instrumentos de evaluación · UNIJJAR</title><style>:root{font-family:system-ui,Arial;color:#173849;background:#edf4f4}*{box-sizing:border-box}body{margin:0}header{padding:24px;background:#124b62;color:white}a{color:inherit}main{max-width:1250px;margin:24px auto;padding:0 16px}.panel{background:white;padding:24px;border-radius:15px;box-shadow:0 5px 20px #1232;margin-bottom:16px}label{display:block;font-weight:600;font-size:14px}input,select{padding:10px;border:1px solid #abc3ca;border-radius:8px;width:100%;margin-top:5px}button{background:#126a80;border:0;color:white;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.tasks{display:grid;grid-template-columns:repeat(7,minmax(95px,1fr));gap:10px;overflow:auto}.muted{color:#607783}#msg{color:#08735b;font-weight:600} .entry{border:1px solid #d4e2e7;border-radius:12px;padding:16px;margin:12px 0;background:#f8fbfd}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.entry small{color:#667}.entry button{margin:5px}  .folderbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:14px 0}.folderbar label{flex:1;min-width:200px}.foldercards{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.foldercard{background:#eff7f7;color:#145468;border:1px solid #bad7d8;border-radius:12px;padding:12px 16px}.foldercard.active{background:#14677b;color:#fff}.danger{background:#a93d48}.entry{border-left:5px solid #1695a4}.entry h3{margin-top:0}.entry .meta{color:#456b79;font-size:13px}.entry .scores{margin-top:12px}.grid label{min-width:0}header{background:linear-gradient(110deg,#113a56,#167e85)}@media(max-width:700px){.panel{padding:16px}.folderbar{display:grid;grid-template-columns:1fr 1fr}.folderbar label{grid-column:span 2}} </style></head><body><header><h1>🧰 Instrumentos de evaluación</h1><a href="../control-notas/index.html">← Control de Notas</a> · <a href="../index.html">Inicio</a></header><main><section class="panel"><h2>Grupo académico</h2><div id="fields" class="grid"></div><p class="muted" id="academicHint"></p></section><section class="panel"><h2>Biblioteca de instrumentos</h2><div class="folderbar"><label>Carpeta activa<select id="folderSelect"></select></label><label>Nueva carpeta<input id="folderName" placeholder="Ej. Rúbricas de exposiciones"></label><button id="newFolder">＋ Crear carpeta</button><button id="deleteFolder" class="danger">Eliminar carpeta</button></div><div id="folderCards" class="foldercards"></div><h3>Crear instrumento en la carpeta seleccionada</h3><div class="grid"><label>Nombre del instrumento<input id="title" placeholder="Ej. Lista de cotejo: Speaking"></label><label>Parcial<select id="partial"><option value="1">I Parcial</option><option value="2">II Parcial</option><option value="3">III Parcial</option></select></label><label>Actividad<select id="slot"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option><option>Ex</option></select></label><label>Fecha de evaluación<input type="date" id="date"></label><label>Máximo<input type="number" id="maximum" min="0" step="0.01" value="10"></label></div><p><button id="create">＋ Crear instrumento</button> <button id="backup">⇩ Exportar instrumentos</button> <button id="load">⇧ Importar respaldo</button><input id="loadFile" type="file" accept=".json" hidden></p><div id="library"></div><button id="save">💾 Guardar instrumentos</button><p id="msg" role="status"></p></section><section class="panel" style="max-width:1100px;margin:20px auto;padding:20px;border:1px solid #ccd9e7;border-radius:12px"><h2>Respaldo Firebase de Instrumentos</h2><label>Correo docente <input type="email" id="instCloudEmail"></label> <label>Contraseña <input type="password" id="instCloudPass"></label> <button id="instCloudLogin">Conectar</button> <button id="instCloudUpload">Guardar instrumentos en Firebase</button> <button id="instCloudDownload">Recuperar instrumentos desde Firebase</button><p id="instCloudStatus" role="status">Sin conectar</p></section></main><script src="app.js"></script><script type="module" src="firebase.js"></script></body></html>
